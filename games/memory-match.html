<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match</title>
<link rel="stylesheet" href="game-nav.css" />
<style>
:root{
  --bg:#eef5fb;
  --ink:#20324a;
  --muted:#718096;
  --card:#2f6da8;
  --card2:#3f83c4;
  --panel:#ffffff;
  --line:#d9e4ef;
  --good:#2ea66f;
  --bad:#d95757;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
html,body{height:100%;overflow:hidden}
body{height:100vh}
button{font:inherit}

.app{
  height:100vh;
  display:grid;
  grid-template-rows:64px minmax(0,1fr) 96px;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.9),transparent 34%),
    linear-gradient(180deg,#f7fbff 0%,#eaf4fb 70%,#d9edf9 100%);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:10px 16px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.title-wrap{display:flex;align-items:center;gap:12px}
.logo{
  width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:24px;font-weight:1000;
  box-shadow:0 8px 18px rgba(32,50,74,.15)
}
h1{margin:0;font-size:clamp(1.35rem,2.2vw,2rem)}
.subtitle{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  background:#f5f8fb;border:1px solid var(--line);border-radius:999px;
  padding:9px 13px;font-weight:800;font-size:13px;color:#526278
}
.control-btn{
  border:0;background:var(--ink);color:#fff;border-radius:12px;
  padding:10px 14px;font-weight:900;cursor:pointer
}
.control-btn:hover{filter:brightness(1.08)}

.pairs-button{
  cursor:pointer;
  color:#526278;
}
.pairs-button:hover{background:#eaf0f6}
.topbar{position:relative;z-index:80}
.pair-menu{
  position:absolute;
  right:112px;
  top:58px;
  z-index:95;
  width:250px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 18px 40px rgba(32,50,74,.18);
  padding:12px;
  opacity:0;
  transform:translateY(-8px) scale(.98);
  pointer-events:none;
  transition:.18s ease;
}
.pair-menu.show{
  opacity:1;
  transform:none;
  pointer-events:auto;
}
.pair-menu-title{
  font-size:12px;
  font-weight:1000;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:#7b8798;
  margin:2px 4px 10px;
}
.pair-options{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.pair-option{
  border:1px solid var(--line);
  background:#f6f9fc;
  color:#31445f;
  min-height:40px;
  border-radius:10px;
  font-weight:900;
  cursor:pointer;
}
.pair-option:hover{background:#eaf1f7}
.pair-option.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}


.game-area{
  position:relative;
  z-index:1;
  min-height:0;
  padding:18px 16px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.board{
  width:min(1320px,100%);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.card{
  position:relative;
  min-height:0;
  perspective:1200px;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  min-width:0;
  outline:none;
}
.card:focus-visible{filter:drop-shadow(0 0 0 4px rgba(32,50,74,.3))}
.card-inner{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.8,.2,1);
}
.card.flipped .card-inner,
.card.matched .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;inset:0;
  border-radius:16px;
  backface-visibility:hidden;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.65);
  box-shadow:
    0 10px 20px rgba(55,91,126,.18),
    inset 0 0 0 2px rgba(255,255,255,.16);
}
.card-back{
  background:
    linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,0) 35%),
    linear-gradient(145deg,var(--card2),var(--card));
  display:grid;
  place-items:center;
  color:white;
}
.back-icon{
  width:62px;height:62px;border-radius:18px;
  border:4px solid rgba(255,255,255,.7);
  display:grid;place-items:center;
  font-size:34px;font-weight:1000;
  background:rgba(255,255,255,.08);
  transform:rotate(-4deg)
}
.card-front{
  background:#fff;
  transform:rotateY(180deg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  text-align:center;
}
.card-content{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.card-type{
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  font-weight:1000;
  color:#8a97a8;
}
.card-text{
  font-size:clamp(16px,1.55vw,27px);
  line-height:1.16;
  font-weight:1000;
  color:#24344e;
  overflow-wrap:anywhere;
}
.card-text.small{
  font-size:clamp(12px,1.1vw,18px);
  line-height:1.3;
}
.card-emoji{
  font-size:clamp(42px,4.5vw,72px);
  line-height:1;
}
.card-image{
  width:min(150px,70%);
  max-height:82px;
  object-fit:contain;
  border-radius:12px;
}

.card.matched{
  cursor:default;
  animation:matchPop .6s ease;
}
.card.matched .card-front{
  box-shadow:inset 0 0 0 6px rgba(46,166,111,.75)
}
.card.matched::after{
  content:"✓";
  position:absolute;
  right:-6px;top:-8px;
  width:38px;height:38px;border-radius:50%;
  background:var(--good);color:#fff;
  display:grid;place-items:center;
  font-weight:1000;font-size:22px;
  z-index:5;
  box-shadow:0 6px 12px rgba(46,166,111,.25)
}
.card.mismatch{animation:shake .38s ease}

.board.dense{gap:7px}
.board.dense .card-face{border-radius:13px}
.board.dense .card-front{padding:10px}
.board.dense .back-icon{width:48px;height:48px;font-size:28px;border-radius:14px}
.board.dense .card-type{font-size:9px}
.board.dense .card-text{font-size:clamp(12px,1.05vw,18px)}
.board.dense .card-text.small{font-size:clamp(9px,.8vw,13px)}
.board.dense .card-emoji{font-size:clamp(34px,3.4vw,54px)}


.statsbar{
  margin:4px 16px 6px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 14px 30px rgba(55,91,126,.12);
  padding:6px 12px 0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}
.stat{
  text-align:center;
  padding:8px;
  min-width:0;
}
.stat-value{
  font-size:clamp(18px,2vw,28px);
  font-weight:1000;
  line-height:1;
}
.stat-label{
  margin-top:3px;
  font-size:11px;
  letter-spacing:.7px;
  text-transform:uppercase;
  color:#7a8798;
  font-weight:900;
}
.message{
  grid-column:1/-1;
  text-align:center;
  font-weight:900;
  color:#506079;
  min-height:0;
  height:0;
  padding:0;
  margin:0;
  overflow:hidden;
  font-size:13px;
}
.message.good{color:var(--good)}
.message.bad{color:var(--bad)}

.win-overlay{
  position:fixed;inset:0;
  background:rgba(232,241,248,.88);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:30
}
.win-overlay.show{display:flex}
.win-card{
  width:min(520px,92vw);
  background:white;
  border:1px solid var(--line);
  border-radius:28px;
  padding:34px;
  text-align:center;
  box-shadow:0 24px 60px rgba(32,50,74,.18)
}
.win-card h2{margin:0 0 8px;font-size:42px}
.win-card p{margin:0;color:#6d7a90;font-weight:700}
.win-score{font-size:56px;font-weight:1000;margin:20px 0 22px}
.win-card button{
  border:0;background:var(--ink);color:#fff;border-radius:14px;
  padding:13px 20px;font-weight:900;cursor:pointer
}

@keyframes matchPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}
  75%{transform:translateX(-5px)}
}

@media (max-width:1100px){
  .topbar{padding:8px 12px}
  .board{gap:8px}
  .card-text{font-size:clamp(14px,1.5vw,22px)}
  .card-text.small{font-size:clamp(10px,1vw,15px)}
}
@media (max-width:760px){
  html,body{overflow:auto;height:auto}
  body{height:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:auto auto auto}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{aspect-ratio:1.15/1}
  .statsbar{grid-template-columns:repeat(3,1fr)}
}

.side-nav-handle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:60;width:38px;height:94px;border:0;border-radius:0 16px 16px 0;background:#20324a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 24px rgba(32,50,74,.2);transition:.22s ease}
.side-nav-handle:hover{background:#2a405f}
.side-nav-handle span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:1000;letter-spacing:1.2px;text-transform:uppercase}
.side-nav{position:fixed;left:0;top:0;bottom:0;z-index:70;width:min(310px,86vw);background:rgba(255,255,255,.98);border-right:1px solid var(--line);box-shadow:18px 0 40px rgba(32,50,74,.16);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:18px;backdrop-filter:blur(12px)}
.side-nav.open{transform:translateX(0)}
.side-nav-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.side-nav-title{display:flex;align-items:center;gap:11px}
.side-nav-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#20324a;color:#fff;font-size:20px;font-weight:1000}
.side-nav-title strong{display:block;font-size:18px}
.side-nav-title small{display:block;margin-top:2px;color:#7a8798;font-weight:700}
.side-nav-close{width:38px;height:38px;border:1px solid var(--line);background:#f6f9fc;color:#40516a;border-radius:11px;cursor:pointer;font-size:20px;font-weight:900}
.side-nav-menu{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.side-nav-item{width:100%;border:1px solid var(--line);background:#f8fbfe;color:#2e405a;border-radius:15px;padding:14px 15px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font-weight:900;transition:.16s ease}
.side-nav-item:hover{transform:translateX(3px);background:#eef5fb;border-color:#c8d8e6}
.side-nav-item .nav-glyph{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;background:#e8f0f7;font-size:19px}
.side-nav-item span:last-child{display:flex;flex-direction:column;gap:2px}
.side-nav-item small{color:#7a8798;font-weight:700;font-size:11px}
.side-nav-backdrop{position:fixed;inset:0;z-index:65;background:rgba(24,38,56,.26);opacity:0;pointer-events:none;transition:opacity .24s ease}
.side-nav-backdrop.show{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<button class="side-nav-handle" id="sideNavHandle" type="button" aria-label="Open navigation" aria-expanded="false"><span>Menu</span></button>
<div class="side-nav-backdrop" id="sideNavBackdrop"></div>
<aside class="side-nav" id="sideNav" aria-hidden="true">
  <div class="side-nav-header">
    <div class="side-nav-title">
      <div class="side-nav-icon">☰</div>
      <div><strong>Game Menu</strong><small>Quick options</small></div>
    </div>
    <button class="side-nav-close" id="sideNavClose" type="button" aria-label="Close navigation">×</button>
  </div>
  <div class="side-nav-menu">
    <button class="side-nav-item" id="importGroupBtn" type="button"><span class="nav-glyph">👥</span><span>Import Group<small>Load a saved class or group</small></span></button>
    <button class="side-nav-item" id="importListBtn" type="button"><span class="nav-glyph">📋</span><span>Import List<small>Load a custom matching list</small></span></button>
    <button class="side-nav-item" id="goBackBtn" type="button"><span class="nav-glyph">←</span><span>Go Back<small>Return to the games page</small></span></button>
  </div>
</aside>

<main class="app">
  <header class="topbar">
    <div class="title-wrap">
      <div class="logo">M</div>
      <div>
        <h1>Memory Match</h1>
        <div class="subtitle">Find the matching pairs</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="pill pairs-button" id="pairsButton" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="pairCountTop">6</span> pairs ▾
      </button>
      <button class="control-btn" id="newGameBtn" type="button">New Game</button>
    </div>

    <div class="pair-menu" id="pairMenu" aria-hidden="true">
      <div class="pair-menu-title">Number of pairs</div>
      <div class="pair-options" id="pairOptions"></div>
    </div>
  </header>

  <section class="game-area">
    <div class="board" id="board" aria-label="Memory matching board"></div>
  </section>

  <section class="statsbar">
    <div class="stat">
      <div class="stat-value" id="moves">0</div>
      <div class="stat-label">Moves</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="misses">0</div>
      <div class="stat-label">Misses</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="pairsFound">0</div>
      <div class="stat-label">Pairs Found</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="time">0:00</div>
      <div class="stat-label">Time</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="accuracy">100%</div>
      <div class="stat-label">Accuracy</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="remaining">6</div>
      <div class="stat-label">Remaining</div>
    </div>
    <div class="message" id="message"></div>
  </section>
</main>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>All matched!</h2>
    <p>You completed every pair.</p>
    <div class="win-score"><span id="finalMoves">0</span> moves</div>
    <button id="playAgainBtn" type="button">Play Again</button>
  </div>
</div>

<script>
/*
=========================================================
EDIT YOUR MATCHING PAIRS HERE

Each pair has two cards: "a" and "b".

Supported card types:
- text
- sentence
- definition
- emoji
- image

Examples:
same word:
a:{type:"text", content:"HERITAGE"}
b:{type:"text", content:"HERITAGE"}

word + definition:
a:{type:"text", content:"ANCESTOR"}
b:{type:"definition", content:"A person in your family who lived many years before you."}

word + sentence:
a:{type:"text", content:"PIONEER"}
b:{type:"sentence", content:"She was a pioneer who explored a new way of solving the problem."}

word + picture:
a:{type:"text", content:"APPLE"}
b:{type:"emoji", content:"🍎"}

For your own picture file:
b:{type:"image", content:"images/apple.png"}
=========================================================
*/

const PAIRS = [
  {
    a:{type:"text",content:"HERITAGE"},
    b:{type:"definition",content:"Traditions, culture, places and objects passed down from the past."}
  },
  {
    a:{type:"text",content:"ANCESTOR"},
    b:{type:"definition",content:"A person in your family who lived many years before you."}
  },
  {
    a:{type:"text",content:"ARTIFACT"},
    b:{type:"definition",content:"An object from the past that can teach us about history."}
  },
  {
    a:{type:"text",content:"PIONEER"},
    b:{type:"sentence",content:"She was a pioneer who was one of the first people to explore the new idea."}
  },
  {
    a:{type:"text",content:"APPLE"},
    b:{type:"emoji",content:"🍎"}
  },
  {
    a:{type:"text",content:"TRADITION"},
    b:{type:"text",content:"TRADITION"}
  },
  {
    a:{type:"text",content:"CULTURE"},
    b:{type:"definition",content:"The ideas, customs, arts and way of life shared by a group of people."}
  },
  {
    a:{type:"text",content:"IDENTITY"},
    b:{type:"definition",content:"The qualities, beliefs and experiences that help show who someone is."}
  },
  {
    a:{type:"text",content:"LANGUAGE"},
    b:{type:"emoji",content:"💬"}
  },
  {
    a:{type:"text",content:"VIEWPOINT"},
    b:{type:"definition",content:"The way a person thinks about or sees something."}
  },
  {
    a:{type:"text",content:"INNOVATION"},
    b:{type:"sentence",content:"The new water-saving system was an innovation that improved the farm."}
  },
  {
    a:{type:"text",content:"FAMILY"},
    b:{type:"emoji",content:"👨‍👩‍👧‍👦"}
  }
];

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const missesEl = document.getElementById("misses");
const pairsFoundEl = document.getElementById("pairsFound");
const timeEl = document.getElementById("time");
const accuracyEl = document.getElementById("accuracy");
const remainingEl = document.getElementById("remaining");
const messageEl = document.getElementById("message");
const pairCountTop = document.getElementById("pairCountTop");
const newGameBtn = document.getElementById("newGameBtn");
const pairsButton = document.getElementById("pairsButton");
const pairMenu = document.getElementById("pairMenu");
const pairOptions = document.getElementById("pairOptions");
const winOverlay = document.getElementById("winOverlay");
const finalMoves = document.getElementById("finalMoves");
const playAgainBtn = document.getElementById("playAgainBtn");
const sideNav = document.getElementById("sideNav");
const sideNavHandle = document.getElementById("sideNavHandle");
const sideNavClose = document.getElementById("sideNavClose");
const sideNavBackdrop = document.getElementById("sideNavBackdrop");
const importGroupBtn = document.getElementById("importGroupBtn");
const importListBtn = document.getElementById("importListBtn");
const goBackBtn = document.getElementById("goBackBtn");

let selectedPairCount = Math.min(6, PAIRS.length);
let activePairs = [];
let cards = [];
let first = null;
let second = null;
let lockBoard = false;
let moves = 0;
let misses = 0;
let matches = 0;
let startedAt = null;
let timerId = null;

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function buildCards(){
  const out=[];
  activePairs.forEach((pair,pairId)=>{
    out.push({pairId,side:"a",...pair.a});
    out.push({pairId,side:"b",...pair.b});
  });
  return shuffle(out);
}

function renderContent(cardData){
  if(cardData.type==="emoji"){
    return `<div class="card-content"><div class="card-type">Picture</div><div class="card-emoji">${escapeHtml(cardData.content)}</div></div>`;
  }

  if(cardData.type==="image"){
    return `<div class="card-content"><div class="card-type">Picture</div><img class="card-image" src="${escapeAttr(cardData.content)}" alt="Match picture"></div>`;
  }

  const small = cardData.type==="definition" || cardData.type==="sentence";
  const label =
    cardData.type==="definition" ? "Definition" :
    cardData.type==="sentence" ? "Sentence" :
    "Word";

  return `<div class="card-content">
    <div class="card-type">${label}</div>
    <div class="card-text ${small ? "small" : ""}">${escapeHtml(cardData.content)}</div>
  </div>`;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}


function fitBoardToViewport(){
  if(window.innerWidth <= 760) {
    board.style.gridAutoRows = "";
    return;
  }
  const gameArea = document.querySelector(".game-area");
  const columns = cards.length > 16 ? 6 : cards.length > 12 ? 5 : 4;
  board.style.gridTemplateColumns = `repeat(${columns}, minmax(0,1fr))`;
  const rows = Math.ceil(cards.length / columns);
  const gap = window.innerWidth <= 1100 ? 8 : 10;
  const available = gameArea.clientHeight;
  const reservedBottomGap = 14;
  const rowHeight = Math.floor((available - reservedBottomGap - gap * (rows - 1)) / rows);
  board.style.gridAutoRows = `${Math.max(82, rowHeight)}px`;
  board.classList.toggle("dense", cards.length > 16);
}

function renderBoard(){
  board.innerHTML="";
  fitBoardToViewport();
  cards.forEach((cardData,index)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="card";
    btn.dataset.index=index;
    btn.setAttribute("aria-label",`Hidden memory card ${index+1}`);

    btn.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="back-icon">?</div>
        </div>
        <div class="card-face card-front">
          ${renderContent(cardData)}
        </div>
      </div>
    `;

    btn.addEventListener("click",()=>flipCard(btn,index));
    board.appendChild(btn);
  });
}

function flipCard(button,index){
  if(lockBoard || button.classList.contains("matched") || button===first) return;

  startTimer();
  button.classList.add("flipped");

  if(!first){
    first=button;
    messageEl.textContent="Choose one more card.";
    messageEl.className="message";
    return;
  }

  second=button;
  moves++;
  movesEl.textContent=moves;
  lockBoard=true;

  const a=cards[Number(first.dataset.index)];
  const b=cards[Number(second.dataset.index)];

  if(a.pairId===b.pairId){
    handleMatch();
  }else{
    handleMismatch();
  }
}

function handleMatch(){
  matches++;
  first.classList.add("matched");
  second.classList.add("matched");

  messageEl.textContent="Match!";
  messageEl.className="message good";

  pairsFoundEl.textContent=matches;
  remainingEl.textContent=activePairs.length-matches;
  updateAccuracy();

  setTimeout(()=>{
    resetTurn();
    if(matches===activePairs.length) finishGame();
  },550);
}

function handleMismatch(){
  misses++;
  missesEl.textContent=misses;
  messageEl.textContent="Not a match.";
  messageEl.className="message bad";

  first.classList.add("mismatch");
  second.classList.add("mismatch");
  updateAccuracy();

  setTimeout(()=>{
    first.classList.remove("flipped","mismatch");
    second.classList.remove("flipped","mismatch");
    resetTurn();
    messageEl.textContent="";
    messageEl.className="message";
  },850);
}

function resetTurn(){
  first=null;
  second=null;
  lockBoard=false;
}

function updateAccuracy(){
  const correct=moves-misses;
  const accuracy=moves===0 ? 100 : Math.round((correct/moves)*100);
  accuracyEl.textContent=`${Math.max(0,accuracy)}%`;
}

function startTimer(){
  if(startedAt) return;
  startedAt=Date.now();
  timerId=setInterval(updateTime,1000);
}

function updateTime(){
  if(!startedAt) return;
  const sec=Math.floor((Date.now()-startedAt)/1000);
  const min=Math.floor(sec/60);
  const rem=sec%60;
  timeEl.textContent=`${min}:${String(rem).padStart(2,"0")}`;
}

function finishGame(){
  if(timerId) clearInterval(timerId);
  updateTime();
  messageEl.textContent="You found every pair!";
  messageEl.className="message good";
  finalMoves.textContent=moves;
  setTimeout(()=>winOverlay.classList.add("show"),500);
}

function newGame(){
  if(timerId) clearInterval(timerId);

  activePairs = PAIRS.slice(0, selectedPairCount);
  cards=buildCards();
  first=null;
  second=null;
  lockBoard=false;
  moves=0;
  misses=0;
  matches=0;
  startedAt=null;
  timerId=null;

  movesEl.textContent="0";
  missesEl.textContent="0";
  pairsFoundEl.textContent="0";
  timeEl.textContent="0:00";
  accuracyEl.textContent="100%";
  remainingEl.textContent=String(activePairs.length);
  pairCountTop.textContent=String(activePairs.length);
  messageEl.textContent="";
  messageEl.className="message";

  winOverlay.classList.remove("show");
  renderBoard();
}


function renderPairOptions(){
  pairOptions.innerHTML="";
  const max=Math.min(12,PAIRS.length);

  for(let n=3;n<=max;n++){
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="pair-option" + (n===selectedPairCount ? " active" : "");
    btn.textContent=n;

    btn.addEventListener("click",()=>{
      selectedPairCount=n;
      pairCountTop.textContent=String(n);
      closePairMenu();
      newGame();
    });

    pairOptions.appendChild(btn);
  }
}

function openPairMenu(){
  renderPairOptions();
  pairMenu.classList.add("show");
  pairMenu.setAttribute("aria-hidden","false");
  pairsButton.setAttribute("aria-expanded","true");
}

function closePairMenu(){
  pairMenu.classList.remove("show");
  pairMenu.setAttribute("aria-hidden","true");
  pairsButton.setAttribute("aria-expanded","false");
}

pairsButton.addEventListener("click",(event)=>{
  event.stopPropagation();
  if(pairMenu.classList.contains("show")) closePairMenu();
  else openPairMenu();
});

document.addEventListener("click",(event)=>{
  if(!pairMenu.contains(event.target) && event.target!==pairsButton){
    closePairMenu();
  }
});


function openSideNav(){
  sideNav.classList.add("open");
  sideNavBackdrop.classList.add("show");
  sideNav.setAttribute("aria-hidden","false");
  sideNavHandle.setAttribute("aria-expanded","true");
}
function closeSideNav(){
  sideNav.classList.remove("open");
  sideNavBackdrop.classList.remove("show");
  sideNav.setAttribute("aria-hidden","true");
  sideNavHandle.setAttribute("aria-expanded","false");
}
sideNavHandle.addEventListener("click",openSideNav);
sideNavClose.addEventListener("click",closeSideNav);
sideNavBackdrop.addEventListener("click",closeSideNav);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSideNav();});
importGroupBtn.addEventListener("click",()=>{closeSideNav();alert("Import Group can be connected to your group import system here.");});
importListBtn.addEventListener("click",()=>{closeSideNav();alert("Import List can be connected to your list import system here.");});
goBackBtn.addEventListener("click",()=>{window.location.href="../index.html#games";});

newGameBtn.addEventListener("click",newGame);
playAgainBtn.addEventListener("click",newGame);
window.addEventListener("resize", fitBoardToViewport);

newGame();
fitBoardToViewport();
</script>
<script src="game-nav.js"></script>
</body>
</html>
